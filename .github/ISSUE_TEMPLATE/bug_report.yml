name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please do not paste private items from your pile. For a security problem, use the Security tab instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open index.html\n2. Press Try it on an inbox\n3. ..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pile Sprint version and your browser with its version.
      placeholder: "Pile Sprint 1.0.0, Chrome 131 on macOS"
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: Anything red in the browser console.
